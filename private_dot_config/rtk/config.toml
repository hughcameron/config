[tracking]
enabled = true
history_days = 90

[display]
colors = true
emoji = true
max_width = 120

[filters]
ignore_dirs = [
    ".git",
    "node_modules",
    "target",
    "__pycache__",
    ".venv",
    "vendor",
]
ignore_files = [
    "*.lock",
    "*.min.js",
    "*.min.css",
]

[tee]
enabled = true
mode = "failures"
max_files = 20
max_file_size = 1048576

[telemetry]
enabled = false

[hooks]
# aws excluded: `rtk aws` compacts JSON values into type placeholders
# ("status": string instead of "status": "RUNNING"), which silently breaks
# JSON/text pipelines. Use raw aws (with --query/--max-items to bound output)
# or the /aws-query Steampipe skill for routine reads.
exclude_commands = ["aws"]
transparent_prefixes = []

[limits]
grep_max_results = 200
grep_max_per_file = 25
status_max_files = 15
status_max_untracked = 10
passthrough_max_chars = 2000
